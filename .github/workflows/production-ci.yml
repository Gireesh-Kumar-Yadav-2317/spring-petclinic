name: Production CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: 
  contents: read

concurrency:
  group: production-ci-${{github.ref}}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: verify Java
        run: java -version

      - name: Run tests and verify build
        run: ./mvnw -B clean verify

      - name: Upload application artifact
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Spring-petclinic-${{github.sha}}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
  
    
